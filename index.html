<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syntax Refresher</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #e5e7eb;
      }

      .box {
        width: min(600px, 90vw);
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
        font-size: 2rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #4b5563;
        background: #0f172a;
        color: #f9fafb;
        font-size: 1rem;
        box-sizing: border-box;
      }

      input[type="text"] {
        margin-bottom: 16px;
      }

      button {
        display: inline-block;
        padding: 12px 18px;
        border: none;
        border-radius: 10px;
        background: #38bdf8;
        color: #082f49;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.95;
      }

      textarea {
        margin-top: 16px;
        min-height: 120px;
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Syntax Refresher</h1>

      <label for="inputText">Input</label>
      <input id="inputText" type="text" placeholder="Type something here" />

      <button id="runBtn" type="button">Process</button>

      <label for="outputText" style="margin-top: 20px;">Output</label>
      <textarea id="outputText" readonly placeholder="Your output will appear here"></textarea>
    </div>

    <script>
      const inputText = document.getElementById('inputText');
      const outputText = document.getElementById('outputText');
      const runBtn = document.getElementById('runBtn');

      runBtn.addEventListener('click', () => {
        const value = inputText.value.trim();
        outputText.value = value ? `You entered: ${value}` : 'Please type something in the input field.';
      });
    </script>
  </body>
</html>
